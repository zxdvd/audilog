name: CI and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_TERM_COLOR: always
  GGML_NATIVE: 'OFF'
  MACOSX_DEPLOYMENT_TARGET: '14.6'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev cmake
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Binary smoke test
        shell: bash
        run: |
          ./target/release/audilog --version
          ./target/release/audilog --help
      - name: Real CPU transcription smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./target/release/audilog model install tiny
          curl --fail --location --retry 3 https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav -o /tmp/jfk.wav
          ./target/release/audilog transcribe /tmp/jfk.wav --model tiny --language en --cpu --output /tmp/audilog-smoke
          python3 scripts/check-smoke.py /tmp/audilog-smoke
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/package.py "$TARGET" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: audilog-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --verify-tag --title "audilog $GITHUB_REF_NAME" --notes-file RELEASE.md
